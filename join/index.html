<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Join a Class — BirdWatchAI</title>

<!--
  Short URL for classroom mode (design notes §9B, which specifies
  "birdwatchai.com/join").

  GitHub Pages serves this repository from its ROOT, so the community site
  lives under /docs/ and the real student page is /docs/join.html. That is
  not an address a seven-year-old can copy off a projector, so this file
  exists purely to make /join work.

  Three redirects, in order of how fast they fire: the meta refresh needs no
  JavaScript, the script runs sooner when it is available, and the link is
  there for anyone both of those fail for. The link is visible rather than
  hidden — a child who lands on a blank page that silently failed has no way
  forward, and "tap the button" is a thing a teacher can say out loud.
-->

<meta http-equiv="refresh" content="0; url=/docs/join.html">
<link rel="canonical" href="/docs/join.html">

<style>
    :root { --bg:#faf8f5; --card:#fff; --ink:#2a2825; --muted:#7a756d; --green:#2d5a3d; }
    @media (prefers-color-scheme: dark) {
        :root { --bg:#1a1a18; --card:#242420; --ink:#f0ede8; --muted:#9a9590; --green:#5aab72; }
    }
    html, body { margin:0; height:100%; }
    body {
        background:var(--bg); color:var(--ink);
        font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        gap:18px; text-align:center; padding:24px; box-sizing:border-box;
    }
    p { color:var(--muted); margin:0; }
    a.go {
        display:inline-block; background:var(--green); color:#fff; text-decoration:none;
        font-weight:700; font-size:1.1rem; padding:16px 28px; border-radius:12px;
    }
</style>
</head>
<body>
    <p>Taking you to your class…</p>
    <a class="go" href="/docs/join.html">Tap here to join</a>
    <script>
      // Carry the query across. The QR encodes /join?c=123456, and dropping
      // the search string here would land every scanned device on an empty
      // form — the exact typing the QR exists to avoid. The meta refresh
      // above cannot do this, so it stays as the no-JavaScript fallback that
      // merely costs the child six digits.
      (function () {
        var to = '/docs/join.html' + (location.search || '');
        var a = document.querySelector('a.go');
        if (a) a.href = to;
        location.replace(to);
      })();
    </script>
</body>
</html>
